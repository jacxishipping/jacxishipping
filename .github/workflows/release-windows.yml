name: Release Windows Admin App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v3.1.0-windows-admin'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Admin Test Suite
        run: |
          dotnet test windows/JacxiShipping.WindowsApp.Tests/JacxiShipping.WindowsApp.Tests.csproj -c Release

      - name: Publish Windows Admin App (win-x64)
        run: |
          dotnet publish windows/JacxiShipping.WindowsApp/JacxiShipping.WindowsApp.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishSingleFile=true `
            --self-contained false `
            -o dist/win-x64

      - name: Build Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "windows/installer/JacxiShipping.iss"

      - name: Create Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/JacxiShipping-Admin-Windows-x64-v3.1.0.zip -Force

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/JacxiShipping-Setup-v3.1.0.exe
            dist/JacxiShipping-Admin-Windows-x64-v3.1.0.zip
            dist/win-x64/JacxiShipping.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Nightly DB Backup

# Runs the database backup on a schedule and commits it to backups/
# so a cascade-delete style incident (like 2026-09-18) is always recoverable.

on:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # prisma generate runs on postinstall; provide the URL it was generated with
          jacxi_PRISMA_DATABASE_URL: ${{ secrets.JACXI_DATABASE_URL }}
          jacxi_POSTGRES_URL: ${{ secrets.JACXI_DATABASE_URL }}

      - name: Run backup
        run: node scripts/backup-db.js
        env:
          jacxi_DATABASE_URL: ${{ secrets.JACXI_DATABASE_URL }}

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No backup changes to commit"
          else
            git commit -m "chore(db): nightly backup $(date -u +%Y-%m-%d)"
            git push
          fi
